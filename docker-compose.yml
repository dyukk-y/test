services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data

  # HTTPS для живого мини-аппа: docker compose --profile web up -d
  # В .env: DOMAIN=dps.example.ru, WEBAPP_PORT=8080, WEBAPP_URL=https://dps.example.ru/
  caddy:
    image: caddy:2
    profiles: ["web"]
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
